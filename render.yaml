# Blueprint for hosting på Render (https://render.com).
# Importer repoet som «Blueprint», så leses denne fila automatisk.
services:
  - type: web
    name: hold-kontakten
    runtime: python
    plan: starter            # «starter» kreves for varig disk (gratisplanen har ikke disk)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: HOLD_KONTAKTEN_PASSORD
        sync: false           # du fyller inn passordet i Render sitt kontrollpanel
      - key: SECRET_KEY
        generateValue: true   # Render lager en tilfeldig, hemmelig nøkkel
      - key: DATABASE_PATH
        value: /data/hold_kontakten.db
    disk:
      name: data
      mountPath: /data        # databasen ligger her og overlever omstart/utrulling
      sizeGB: 1
