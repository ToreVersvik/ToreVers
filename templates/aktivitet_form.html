{% extends "base.html" %}
{% block tittel %}{{ tittel }} · Hold kontakten{% endblock %}

{% block innhold %}
<div class="side-topp">
    <h1>{{ tittel }}</h1>
    <a class="knapp sekundaer" href="{{ url_for('aktiviteter') }}">← Tilbake</a>
</div>

<form method="post" class="skjema">
    <label>
        Tittel *
        <input type="text" name="tittel" value="{{ aktivitet.get('tittel', '') }}"
               placeholder="f.eks. «Gå på fotballkamp»" required autofocus>
    </label>

    <label>
        Beskrivelse
        <textarea name="beskrivelse" rows="2">{{ aktivitet.get('beskrivelse', '') }}</textarea>
    </label>

    <label>
        Passer interesser <span class="hint">(kommaseparert, matcher personers interesser)</span>
        <input type="text" name="passer_interesser"
               value="{{ aktivitet.get('passer_interesser', '') }}"
               placeholder="f.eks. «fotball, sport»">
    </label>

    <label>
        Meldingsmal <span class="hint">(bruk plassholdere: {navn}, {dato}, {aktivitet}, {tidspunkt})</span>
        <textarea name="meldingsmal" rows="4"
                  placeholder="Hei {navn}! Har du lyst til å bli med på {aktivitet} {dato}?">{{ aktivitet.get('meldingsmal', '') }}</textarea>
    </label>

    <div class="skjema-knapper">
        <button type="submit" class="knapp">Lagre</button>
        <a class="knapp sekundaer" href="{{ url_for('aktiviteter') }}">Avbryt</a>
    </div>
</form>
{% endblock %}
