{% extends "base.html" %}
{% block tittel %}{{ tittel }} · Hold kontakten{% endblock %}

{% block innhold %}
<div class="side-topp">
    <h1>{{ tittel }}</h1>
    <a class="knapp sekundaer" href="{{ url_for('personer') }}">← Tilbake</a>
</div>

<form method="post" class="skjema">
    <label>
        Navn *
        <input type="text" name="navn" value="{{ person.get('navn', '') }}" required autofocus>
    </label>

    <label>
        Relasjon *
        <select name="relasjon" required>
            {% for r in relasjoner %}
            <option value="{{ r }}" {{ 'selected' if person.get('relasjon') == r }}>{{ r }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Interesser <span class="hint">(kommaseparert, f.eks. «fotball, matlaging, jakt»)</span>
        <input type="text" name="interesser" value="{{ person.get('interesser', '') }}">
    </label>

    <label>
        Siste kontakt-dato <span class="hint">(la stå tom hvis aldri)</span>
        <input type="date" name="siste_kontakt_dato" value="{{ person.get('siste_kontakt_dato', '') or '' }}">
    </label>

    <label>
        Notater
        <textarea name="notater" rows="4">{{ person.get('notater', '') }}</textarea>
    </label>

    <div class="skjema-knapper">
        <button type="submit" class="knapp">Lagre</button>
        <a class="knapp sekundaer" href="{{ url_for('personer') }}">Avbryt</a>
    </div>
</form>
{% endblock %}
