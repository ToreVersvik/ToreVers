{% extends "base.html" %}
{% block tittel %}Logg inn · Hold kontakten{% endblock %}

{% block innhold %}
<div class="login-wrap">
    <form method="post" class="skjema login-skjema">
        <h1>Logg inn</h1>
        <p class="undertekst">Skriv inn passordet for å få tilgang.</p>
        <label>
            Passord
            <input type="password" name="passord" required autofocus>
        </label>
        <div class="skjema-knapper">
            <button type="submit" class="knapp">Logg inn</button>
        </div>
    </form>
</div>
{% endblock %}
