name: Ukentlig aksjerapport

on:
  # Spredt over mandag morgen UTC for å sikre at minst én trigges
  # GitHub Actions schedule er upålitelig – flere entries øker sjansen
  schedule:
    - cron: "30 5 * * 1"   # 05:30 UTC = 07:30 CEST
    - cron: "30 6 * * 1"   # 06:30 UTC = 08:30 CEST
    - cron: "30 7 * * 1"   # 07:30 UTC = 09:30 CEST
    - cron: "30 8 * * 1"   # 08:30 UTC = 10:30 CEST
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør ukentlig rapport
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_MODEL: "claude-sonnet-4-6"
        run: python run_weekly.py
