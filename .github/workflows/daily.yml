name: Daglig aksjescreening

on:
  # 14:30 UTC = 16:30 CEST (sommer) / 15:30 CET (vinter)
  # Juster til 15:30 UTC på vintertid hvis ønskelig
  schedule:
    - cron: "30 14 * * 1-5"   # hverdager kl 14:30 UTC ≈ 16:30 norsk sommertid
  workflow_dispatch:            # manuell kjøring fra GitHub UI

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør daglig screening
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ANTHROPIC_API_KEY ikke nødvendig for daglig modus
        run: python run_daily.py
